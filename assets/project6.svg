<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chatbot - Autonomous Discord AI Agent in Python">
  <style>
    :root {
      --color-matrix-green: #00FF8C;
      --color-cyan: #00F0FF;
      --color-purple: #B028FF;
    }
  </style>
  <!-- Window -->
  <rect x="40" y="30" width="320" height="240" rx="8" fill="#0a0a0a" stroke="var(--color-matrix-green, #00FF8C)" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="40" y="30" width="320" height="28" rx="8" fill="var(--color-matrix-green, #00FF8C)" fill-opacity="0.08"/>
  <rect x="40" y="50" width="320" height="8" fill="var(--color-matrix-green, #00FF8C)" fill-opacity="0.08"/>
  <circle cx="60" cy="44" r="5" fill="#FF6059"/>
  <circle cx="78" cy="44" r="5" fill="#FEBC30"/>
  <circle cx="96" cy="44" r="5" fill="#2ACA45"/>
  <text x="200" y="49" font-family="monospace" font-size="10" fill="var(--color-matrix-green, #00FF8C)" text-anchor="middle" font-weight="bold">Chatbot</text>
  
  <!-- Command -->
  <text x="60" y="78" font-family="monospace" font-size="9.5" fill="var(--color-matrix-green, #00FF8C)">$ python agent.py --graph=langgraph</text>
  <text x="60" y="95" font-family="monospace" font-size="9" fill="var(--color-cyan, #00F0FF)">[Agent] LangGraph State Engine · ChromaDB Vector Memory</text>
  <line x1="60" y1="104" x2="340" y2="104" stroke="var(--color-matrix-green, #00FF8C)" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Reasoning step -->
  <text x="60" y="122" font-family="monospace" font-size="8.5" fill="var(--color-purple, #B028FF)">🧠 REASONING (LangGraph Node):</text>
  <text x="60" y="138" font-family="monospace" font-size="8.5" fill="#E0E0E0">1. Parse intent → 2. Query ChromaDB → 3. OpenRouter LLM</text>

  <!-- Chat exchange -->
  <line x1="60" y1="148" x2="340" y2="148" stroke="var(--color-matrix-green, #00FF8C)" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="60" y="165" font-family="monospace" font-size="9" fill="#808080">User: How do I configure Niri on Wayland?</text>
  <text x="60" y="183" font-family="monospace" font-size="9" fill="var(--color-matrix-green, #00FF8C)">AI Agent: Checking vector store &amp; generating config...</text>
  <text x="60" y="199" font-family="monospace" font-size="8.5" fill="var(--color-cyan, #00F0FF)">↳ Context recalled: ~/.config/niri/config.kdl [Match: 99.1%]</text>

  <line x1="60" y1="210" x2="340" y2="210" stroke="var(--color-matrix-green, #00FF8C)" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="60" y="226" font-family="monospace" font-size="8.5" fill="#808080">Multi-Model Router: Claude / GPT / DeepSeek</text>

  <!-- Status bar -->
  <rect x="40" y="242" width="320" height="28" fill="var(--color-matrix-green, #00FF8C)" fill-opacity="0.06"/>
  <line x1="40" y1="242" x2="360" y2="242" stroke="var(--color-matrix-green, #00FF8C)" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="60" y="261" font-family="monospace" font-size="9" fill="#2ACA45" font-weight="bold">✓</text>
  <text x="72" y="261" font-family="monospace" font-size="9" fill="var(--color-matrix-green, #00FF8C)">Agent Session active · Vector Memory online</text>
  <rect x="330" y="252" width="6" height="10" fill="var(--color-matrix-green, #00FF8C)">
     <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
