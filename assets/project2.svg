  <text x="280" y="120" font-family="monospace" font-size="10" fill="#B028FF" font-weight="bold">Marks</text>

  <!-- Subjects -->
  <text x="60" y="138" font-family="monospace" font-size="10" fill="#E0E0E0">Mathematics</text>
  <text x="280" y="138" font-family="monospace" font-size="10" fill="#00FF8C">95</text>

  <text x="60" y="156" font-family="monospace" font-size="10" fill="#E0E0E0">Physics</text>
  <text x="280" y="156" font-family="monospace" font-size="10" fill="#00FF8C">88</text>

  <text x="60" y="174" font-family="monospace" font-size="10" fill="#E0E0E0">Chemistry</text>
  <text x="280" y="174" font-family="monospace" font-size="10" fill="#00FF8C">92</text>

  <text x="60" y="192" font-family="monospace" font-size="10" fill="#808080">English</text>
  <text x="280" y="192" font-family="monospace" font-size="10" fill="#00FF8C">78</text>

  <text x="60" y="210" font-family="monospace" font-size="10" fill="#808080">Computer Sc.</text>
  <text x="280" y="210" font-family="monospace" font-size="10" fill="#00FF8C">97</text>

  <!-- Total line -->
